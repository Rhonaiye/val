<html lang="en">
  <head>

    <script>

      function updateCountdown() {
        const countdownElement = document.getElementById("countdown");
        if (timeLeft > 0) {
          countdownElement.innerText = `Redirecting to WhatsApp in ${timeLeft} seconds...`;
          timeLeft--;
          setTimeout(updateCountdown, 1000);
        } else {
          window.location.href = "https://wa.me/+2349131215984?text=Yes%2C%20I%20will%20be%20your%20val%20daddy;)%20"; 
        }
      }

      window.onload = function () {
        updateCountdown();
      };
    </script>
  </head>
